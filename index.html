<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mật khẩu tình yêu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--pink:#ffd3e2;--card:#ffe6ef;--key:#ffeef4;--hot:#ff2d6f;--deep:#c2003f;--soft:#a8355c;--ok:#12794a;
--lit:rgba(255,255,255,.95);--sh:rgba(214,90,130,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(rgba(255,255,255,.55) 1.5px,transparent 1.5px) 0 0/14px 14px,linear-gradient(160deg,#ffe3ee,var(--pink));
color:var(--deep);font-family:"Be Vietnam Pro",system-ui,sans-serif;overflow-x:hidden}
.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:14px 18px 16px;text-align:center;
box-shadow:10px 10px 28px var(--sh),-8px -8px 24px var(--lit)}
.lock-title{margin:0 0 12px;font-family:"Dancing Script",cursive;font-size:clamp(25px,7vw,34px);font-weight:600;line-height:1.15;color:var(--hot);text-shadow:0 2px 8px rgba(255,45,111,.12)}
#lock.out .card{animation:out .7s ease forwards}
@keyframes out{to{opacity:0;transform:scale(.95)}}
.photo{width:100%;height:clamp(150px,30svh,270px);border-radius:20px;overflow:hidden;border:3px solid #fff;background:linear-gradient(150deg,#ffc2d6,#ff9fbd);
display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--sh)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:64px;height:64px;fill:#fff;opacity:.9}
.heart{width:30px;height:30px;margin:12px auto 6px;display:block;fill:var(--hot)}
#lock.open .heart{animation:beat .9s ease 2}
@keyframes beat{40%{transform:scale(1.4)}}
.dots{display:flex;gap:14px;justify-content:center;height:16px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:#ffc0d3;transition:background .15s,transform .15s}
.dot.on{background:var(--hot);transform:scale(1.2)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin:14px auto 0;max-width:260px;justify-items:center}
.k{width:clamp(54px,16vw,64px);aspect-ratio:1;border-radius:50%;border:0;background:var(--key);color:var(--deep);font:inherit;font-size:22px;font-weight:500;padding:0;cursor:pointer;
box-shadow:5px 5px 11px var(--sh),-5px -5px 11px var(--lit);transition:box-shadow .1s,transform .1s;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.k:active{box-shadow:inset 3px 3px 7px var(--sh),inset -3px -3px 7px var(--lit);transform:scale(.97)}
.k.fn{background:transparent;box-shadow:none}
.k.fn svg{width:22px;height:22px;fill:var(--hot)}
.k:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.msg{min-height:1.4em;margin:14px 0 0;font-size:14px;font-weight:600}
.msg.err{color:var(--deep)}
.msg.ok{color:var(--ok)}
.hint{min-height:1.3em;margin:2px 0 0;font-size:13px;font-weight:400;color:var(--soft);opacity:0;transition:opacity .4s}
.hint.show{opacity:1}
.pop{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(255,205,224,.55);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .25s}
.pop.show{opacity:1;pointer-events:auto}
.pop .box{width:100%;max-width:300px;background:var(--card);border-radius:26px;padding:26px 22px 24px;text-align:center;box-shadow:10px 10px 28px var(--sh),-8px -8px 24px var(--lit);transform:scale(.9);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.pop.show .box{transform:scale(1)}
.ico{width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:#fff}
.pop.ok .ico{background:var(--ok)}
.pop.err .ico{background:var(--deep)}
.pt{margin:0 0 6px;font-size:22px;font-weight:600}
.pop.ok .pt{color:var(--ok)}
.pop.err .pt{color:var(--deep)}
.px{margin:0;font-size:15px;line-height:1.5;color:var(--soft)}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:30;background:#2a0f3d}
#game[hidden]{display:none}
#next{display:none}
#next.show{display:flex}
#next .card{padding:22px 22px 26px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #fff;margin:0 auto 10px;box-shadow:0 6px 16px var(--sh);display:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.days{font-family:"Dancing Script",cursive;font-size:28px;color:var(--soft);margin:0}
.num{font-size:clamp(64px,20vw,92px);font-weight:300;line-height:1.05;color:var(--hot);margin:0}
.letter{margin:20px 0 0;line-height:1.8;font-weight:400;font-size:16px;color:var(--deep);text-align:left}
.letter p{margin:0 0 12px;opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease}
.letter p.in{opacity:1;transform:none}
.sign{font-family:"Dancing Script",cursive;font-size:28px;color:var(--hot);text-align:right}
.fx{position:fixed;left:0;top:0;z-index:20;pointer-events:none;font-size:22px;line-height:1;will-change:transform,opacity;animation:bloom var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bloom{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(var(--s)) rotate(var(--r))}}
@media (max-height:690px){.heart{margin:8px auto 4px}.keys{gap:8px 12px;margin-top:10px}.msg{margin-top:8px}}
@media (prefers-reduced-motion:reduce){.fx{display:none}*{animation:none!important;transition:none!important}.letter p{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="screen" id="lock">
  <div class="card">
    <div class="photo" id="photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.7 1 5.6 3 1.9-2 3.6-3 5.6-3C21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z"/></svg>
    </div>
    <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.7 1 5.6 3 1.9-2 3.6-3 5.6-3C21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z"/></svg>
    <div class="dots" id="dots" aria-label="Mật khẩu"></div>
    <h1 class="lock-title">Ngày chúng ta bên nhau ❤️</h1>
    <div class="keys" id="keys"></div>
  </div>
</main>

<div class="pop" id="pop" role="alert" aria-live="assertive">
  <div class="box"><div class="ico" id="ico"></div><p class="pt" id="pt"></p><p class="px" id="px"></p></div>
</div>

<iframe id="game" title="Love Shooter" hidden allow="autoplay"></iframe>

<script>
// ===== Chỉnh ở đây =====
const PASSWORD = "0312";                       // mật khẩu gồm các chữ số
const HINT = "Gợi ý: ngày mình chính thức yêu nhau (ngày tháng)";
const PHOTO = "";                              // ảnh (data URI), để trống thì hiện trái tim
// =======================
const $ = id => document.getElementById(id);
let val = "", busy = false, gameOn = false;
const GAME = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ff7eb6\">\n<title>Love Shooter: Birthday Rescue</title>\n<style>\n/* CÍU CHÒN VỚI 🥺: BIRTHDAY RESCUE - styles */\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\nhtml,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#2a0f3d;color:#fff;font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif}\n#game{position:fixed;inset:0}\n#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ff8fc2,#7a4bd6 60%,#2a0f3d)}\ncanvas{display:block;border-radius:10px;box-shadow:0 0 28px #ff4f9a99;touch-action:none}\n.hide{display:none!important}\nbutton{font-family:inherit;cursor:pointer}\n\n/* HUD */\n#hud{position:absolute;z-index:2;top:max(6px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:5px;align-items:center;pointer-events:none;font-size:clamp(11px,2.9vw,16px)}\n.st{background:#3b0f5ccc;border:1px solid #ff8fc2;border-radius:14px;padding:3px 9px;white-space:nowrap}\n.st:empty{display:none}\n.ic{margin-left:auto;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:#ff5fa2cc;color:#fff;font-size:18px}\n#banner{position:absolute;z-index:3;left:0;right:0;top:34%;text-align:center;font-size:clamp(24px,7vw,54px);font-weight:900;text-shadow:0 0 18px #ff2d7a,0 3px 0 #9c1546;pointer-events:none;animation:pop .5s ease-out}\n@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}\n\n/* Touch controls */\n#touch{position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}\n.pad{display:flex;gap:12px;align-items:flex-end}\n#touch button{pointer-events:auto;touch-action:none;width:clamp(60px,17vw,86px);height:clamp(60px,17vw,86px);border-radius:50%;border:3px solid #fff;background:#ff5fa28f;color:#fff;font-size:clamp(24px,7vw,34px);box-shadow:0 0 14px #ff5fa2aa}\n#touch .big{width:clamp(76px,22vw,106px);height:clamp(76px,22vw,106px);background:#e0245ecc}\n#touch button.on{background:#ff2d7a;transform:scale(.92)}\n\n/* Screens */\n.screen{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:radial-gradient(#ff7eb685,#4b1d73d9);overflow-y:auto;touch-action:pan-y}\nh1{margin:0;font-size:clamp(34px,10vw,70px);text-shadow:0 0 20px #ff2d7a,0 4px 0 #9c1546;animation:beat 1.6s ease-in-out infinite}\n@keyframes beat{50%{transform:scale(1.06)}}\nh2{margin:0;font-size:clamp(22px,6vw,34px);text-shadow:0 0 14px #ff2d7a}\n.sub{margin:0 0 8px;font-size:clamp(15px,4vw,22px)}\n.screen p{margin:0;max-width:520px;font-size:clamp(14px,3.8vw,18px);line-height:1.45}\n.btn{width:min(300px,82vw);padding:13px 16px;border:none;border-radius:30px;font-size:clamp(15px,4.4vw,20px);font-weight:700;color:#fff;background:linear-gradient(#ff5fa2,#e0245e);box-shadow:0 4px 0 #9c1546,0 0 18px #ff5fa2aa}\n.btn.alt{background:linear-gradient(#a96bff,#6d2fd1);box-shadow:0 4px 0 #43198a,0 0 18px #a96bffaa}\n.btn:active{transform:translateY(3px)}\n.btn.sm{width:auto;padding:8px 18px;font-size:14px;margin-top:8px}\n\n/* Birthday dialogue */\n#bday{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:min(94vw,640px);max-height:62%;overflow-y:auto;touch-action:pan-y;text-align:center;background:#fff0f7ee;color:#7a1646;border:3px solid #ff5fa2;border-radius:20px;padding:12px 16px;font-size:clamp(13px,3.6vw,18px);box-shadow:0 0 30px #ff2d7a99}\n#msg{white-space:pre-wrap;text-align:left;line-height:1.4}\n#fin{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}\n#fin h2{color:#c4204f;text-shadow:none;font-size:clamp(17px,5vw,26px)}\n\n@media (max-height:420px){.screen{gap:7px}h1{font-size:34px}.btn{padding:9px 14px}}\n@media (prefers-reduced-motion:reduce){h1,#banner{animation:none}}\n\n</style>\n</head>\n<body>\n<div id=\"game\">\n  <div id=\"stage\"><canvas id=\"cv\" width=\"800\" height=\"450\"></canvas></div>\n\n  <!-- HUD: health hearts, score, level, enemies left and defeated -->\n  <div id=\"hud\" class=\"hide\">\n    <div class=\"st\" id=\"hearts\"></div>\n    <div class=\"st\">⭐ <b id=\"sc\">0</b></div>\n    <div class=\"st\">Level <b id=\"lv\">1</b>/3</div>\n    <div class=\"st\">Left <b id=\"rem\">0</b></div>   \n    <div class=\"st\">Defeated <b id=\"def\">0</b></div>\n    <div class=\"st\" id=\"pwr\"></div>\n    <button class=\"ic\" data-a=\"pause\" aria-label=\"Pause\">⏸</button>\n  </div>\n  <div id=\"banner\" class=\"hide\"></div>\n\n  <!-- Touch controls (shown on touch devices during play) -->\n  <div id=\"touch\" class=\"hide\">\n    <div class=\"pad\"><button data-k=\"L\" aria-label=\"Left\">◀</button><button data-k=\"R\" aria-label=\"Right\">▶</button></div>\n    <div class=\"pad\"><button data-k=\"J\" aria-label=\"Jump\">⬆</button><button data-k=\"S\" class=\"big\" aria-label=\"Shoot\">❤</button></div>\n  </div>\n\n  <section id=\"menu\" class=\"screen\">\n    <h1> CÍU CHÒN VỚI ❤️</h1>\n    <p class=\"sub\"> Chòn bị bắt rùi 😭😭</p>\n    <button class=\"btn\" data-a=\"start\"> Bắt đầu </button>\n    <button class=\"btn alt\" data-a=\"help\">Hướng dẫn</button>\n    <button class=\"btn alt snd\" data-a=\"snd\">Âm Thanh: On</button>\n  </section>\n\n  <section id=\"help\" class=\"screen hide\">\n    <h2> CÁCH CHƠI</h2>\n    <p>  bắn quái cíu chòn </p>\n    <p><b>Desktop:</b> A / D or arrows to move, W or Space to jump, mouse to aim, hold left click to shoot, Esc to pause.<br>\n    <b>Mobile:</b> use the on-screen buttons. Hold the ❤ button to shoot, and it aims at the nearest enemy.</p>\n    <p>Power-ups: ⚡ rapid fire, 💥 double damage, 💖 heal, 🛡️ shield.</p>\n    <button class=\"btn\" data-a=\"back\">Back</button>\n  </section>\n\n  <section id=\"pause\" class=\"screen hide\">\n    <h2>Paused</h2>\n    <button class=\"btn\" data-a=\"resume\">Resume</button>\n    <button class=\"btn alt\" data-a=\"start\">Restart</button>\n    <button class=\"btn alt snd\" data-a=\"snd\">Sound: On</button>\n    <button class=\"btn alt\" data-a=\"menu\">Main Menu</button>\n  </section>\n\n  <section id=\"over\" class=\"screen hide\">\n    <h2> MẤT CHÒN LUN 💔</h2>\n    <p>Final score: <b id=\"fs\">0</b></p>\n    <button class=\"btn\" data-a=\"start\">Cíu Lại</button>\n    <button class=\"btn alt\" data-a=\"menu\">Main Menu</button>\n  </section>\n\n  <!-- Birthday dialogue and ending -->\n  <section id=\"bday\" class=\"hide\">\n    <div id=\"msg\"></div>\n    <button class=\"btn sm\" id=\"bSkip\" data-a=\"skip\">Hiển thị toàn bộ</button>\n    <div id=\"fin\" class=\"hide\">\n      <h2>CHÒN CẢM ƠN VỢ Ạ ❤️</h2>\n      <button class=\"btn\" data-a=\"again\">ĐỌC LẠI</button>\n      <button class=\"btn alt\" data-a=\"start\">CHƠI LẠI</button>\n      <button class=\"btn alt\" data-a=\"menu\">Main Menu</button>\n    </div>\n  </section>\n</div>\n<script>\n'use strict';\n/* LOVE SHOOTER: BIRTHDAY RESCUE\n   Vanilla JS + Canvas 2D + Web Audio. Every listener is registered once;\n   reset() rebuilds all game state, so restarting leaves nothing behind. */\n\n/* ---------- constants and helpers ---------- */\nconst $ = id => document.getElementById(id), cv = $('cv'), c = cv.getContext('2d');\nconst W = 800, H = 450, G = 390, GRAV = 1500;                       // logical size, ground line, gravity\nconst PINK = ['#ff5fa2', '#ff8fc2', '#ff2d7a', '#ffc2e0', '#b76bff', '#ffd166'];\nconst WAVES = [6, 9, 12], TOTAL = WAVES.reduce((a, b) => a + b);    // enemies per level, grand total\nconst POOL = [['slime', 'bat'], ['slime', 'bat', 'imp'], ['bat', 'imp', 'slime', 'imp']];\nconst PLATS = [{ x: 110, y: 300, w: 150 }, { x: 330, y: 235, w: 140 }, { x: 520, y: 300, w: 110 }];\nconst MSG = `Happy Birthday, My Love! ❤️🎂\n\n Cảm ơn vợ đã đến thế giới của mìn mang đến cho mìn nhều hạnh phúc.Chúc vợ hôm nay và mãi về sau luôn xinh đẹp,hạnh phúc và ngập tràn tiếng cười. Mong rằng ước mơ trong tim em sẽ thành hiện thực. IU vợ nhìu ạ 💖🌹`;\nconst rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst TOUCH = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;\nlet state = 'menu', S, keys = {}, mouse = { x: 400, y: 200, on: false, down: false }, last = 0, tm = 0, tw = null, bn = null;\n\n/* ---------- audio (Web Audio, no files) ---------- */\nlet AC = null, snd = true;\nfunction ac() {                                   // created and resumed only inside user gestures\n  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }\n  if (AC && AC.state === 'suspended') AC.resume();\n  fwLoad();\n  if (state === 'birthday' && snd && MUSIC.paused) { const p = MUSIC.play(); if (p && p.catch) p.catch(() => { }); }\n  return AC;\n}\nfunction tone(f, d = .1, type = 'sine', v = .07, f2 = 0, delay = 0) {\n  if (!snd || !AC) return;\n  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();\n  o.type = type; o.frequency.setValueAtTime(f, t);\n  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);\n  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);\n  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);\n}\n/* Fireworks audio. Like a real shell, two sounds: a lift whistle at launch and a burst bang at the\n   exact moment the shell explodes. Uses the same sample files as the reference show, with a\n   synthesized fallback when they cannot be loaded. */\nconst FW_BASE = 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/';\nconst FW_SRC = { lift: ['lift1.mp3', 'lift2.mp3', 'lift3.mp3'], burst: ['burst1.mp3', 'burst2.mp3'] };\nconst FW_BUF = {};\nlet fwLoading = false;\nfunction fwLoad() {\n  if (fwLoading || !AC) return; fwLoading = true;\n  Object.keys(FW_SRC).forEach(k => FW_SRC[k].forEach(n =>\n    fetch(FW_BASE + n).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })\n      .then(d => new Promise((ok, no) => AC.decodeAudioData(d, ok, no)))\n      .then(buf => (FW_BUF[k] = FW_BUF[k] || []).push(buf))\n      .catch(() => { })));\n}\nfunction fwPlay(k, rate) {\n  const bs = FW_BUF[k]; if (!bs || !bs.length) return false;\n  const s = AC.createBufferSource(); s.buffer = bs[(Math.random() * bs.length) | 0]; s.playbackRate.value = rate;\n  s.connect(AC.destination); s.start(0); return true;\n}\nfunction fwLift(T) {                              // T = seconds the shell takes to rise\n  if (!snd || !AC) return;\n  if (fwPlay('lift', rnd(.85, .95))) return;\n  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();\n  o.type = 'triangle'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(1050, t + T);\n  g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.035, t + T * .3); g.gain.exponentialRampToValueAtTime(.001, t + T);\n  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + T + .02);\n}\nfunction fwBurst() {\n  if (!snd || !AC) return;\n  if (fwPlay('burst', rnd(.8, .9))) return;\n  const t = AC.currentTime, len = Math.floor(AC.sampleRate * .8), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);\n  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 1.8;\n  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();\n  n.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTim if(PHOTO){
  const mk = () => { const i = new Image(); i.src = PHOTO; i.alt = ""; return i; };
  $("photo").replaceChildren(mk());
  $("avatar").appendChild(mk()); $("avatar").style.display = "block";
}

const dots = $("dots");
for(let i = 0; i < PASSWORD.length; i++){ const d = document.createElement("span"); d.className = "dot"; dots.appendChild(d); }

const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H7c-.7 0-1.200.4-1.600.9L0 12l5.400 8.100c.4.500.9.900 1.600.9h15c1.100 0 2-.9 2-2V5c0-1.100-.9-2-2-2zm-3 12.600L17.600 17 14 13.400 10.400 17 9 15.600 12.600 12 9 8.400 10.400 7 14 10.600 17.600 7 19 8.400 15.400 12 19 15.600z"/></svg>';
const keys = $("keys");
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(t => {
  if(t === ""){ keys.appendChild(document.createElement("span")); return; }
  const b = document.createElement("button");
  b.type = "button";
  b.className = "k" + (t === "⌫" ? " fn" : "");
  if(t === "⌫"){ b.innerHTML = BACK; b.setAttribute("aria-label", "Xóa một số"); }
  else { b.textContent = t; b.setAttribute("aria-label", "Số " + t); }
  b.addEventListener("click", () => { if(t !== "⌫" && !busy) bloom(b); press(t); });
  keys.appendChild(b);
});

const FLOWERS = ["🌸","🌺","🌷","🌹","💮","🌼"];
function bloom(el){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i = 0; i < 7; i++){
    const f = document.createElement("span");
    const a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 60;
    f.className = "fx";
    f.textContent = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
    f.style.cssText = "--x:" + (cx - 11) + "px;--y:" + (cy - 11) + "px;--dx:" + Math.cos(a) * dist + "px;--dy:" + (Math.sin(a) * dist - 30) + "px;--s:" + (0.8 + Math.random() * 0.9) + ";--r:" + (Math.random() * 360 - 180) + "deg;--d:" + (0.8 + Math.random() * 0.5) + "s";
    document.body.appendChild(f);
    f.addEventListener("animationend", () => f.remove());
  }
}
function paint(){ [...dots.children].forEach((d,i) => d.classList.toggle("on", i < val.length)); }
const pop = $("pop");
function showPop(kind, title, text){
  pop.className = "pop show " + kind;
  $("ico").textContent = kind === "ok" ? "✓" : "✕";
  $("pt").textContent = title; $("px").textContent = text;
}
function hidePop(){ pop.classList.remove("show"); }
pop.addEventListener("click", () => { if(pop.classList.contains("err")) closeWrong(); });
let wrongTimer;
function closeWrong(){ clearTimeout(wrongTimer); hidePop(); val = ""; paint(); busy = false; }

function press(t){
  if(busy) return;
  if(t === "⌫") val = val.slice(0,-1);
  else if(val.length < PASSWORD.length) val += t;
  paint();
  if(val.length === PASSWORD.length) setTimeout(check, 180);
}

function check(){
  busy = true;
  if(val === PASSWORD){
    showPop("ok", "Nhập đúng rồi!", "Đang mở khóa cho em");
    $("lock").classList.add("open");
    setTimeout(() => { hidePop(); $("lock").classList.add("out"); }, 2100);
    setTimeout(reveal, 2800);
  }else{
    showPop("err", "Chưa đúng rồi", HINT);
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
    wrongTimer = setTimeout(closeWrong, 2800);
  }
}

function reveal(){
  $("lock").style.display = "none";
  gameOn = true;
  const f = $("game");
  f.srcdoc = GAME;
  f.hidden = false;
  f.addEventListener("load", () => f.contentWindow && f.contentWindow.focus(), { once: true });
}

document.addEventListener("keydown", e => {
  if(gameOn) return;
  if(/^[0-9]$/.test(e.key)){ const b = [...keys.children].find(x => x.textContent === e.key); if(b && !busy) bloom(b); press(e.key); }
  else if(e.key === "Backspace") press("⌫");
});
